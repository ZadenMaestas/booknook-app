site_name: Booknook
site_description: Self-hosted personal library server for ebooks and comics
repo_url: https://github.com/zadenmaestas/booknook-app
repo_name: booknook-app

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Features:
      - Books: features/books.md
      - Comics: features/comics.md
  - Plugins:
      - Plugin System: plugins/writing-plugins.md
      - AI Integration: plugins/ai-integration.md
  - Deployment: deployment.md
  - Database Schema: database.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
